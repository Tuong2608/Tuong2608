  <text x="48" y="180" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">Building grounded RAG systems, production REST APIs, and local-first apps.</text>

