  <rect x="1" y="1" width="1198" height="288" rx="18" fill="url(#glowCyan)" />
  <rect x="1" y="1" width="1198" height="288" rx="18" fill="url(#glowEmerald)" />

  <!-- Top Subtle Gradient Accent Bar -->
