  <text x="48" y="148" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="17.5" font-weight="600">Software &amp; Applied AI Engineering Student @ HCMUTE</text>

