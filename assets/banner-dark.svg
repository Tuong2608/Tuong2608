  <text x="48" y="114" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.6">TRAN VAN TUONG</text>
  <text x="412" y="112" fill="#64748B" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="16" font-weight="500">@Tuong2608</text>

