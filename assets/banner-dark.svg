  <g font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="12.5">
    <text x="758" y="90" fill="#C084FC">const <tspan fill="#38BDF8">engineer</tspan><tspan fill="#94A3B8"> = {</tspan></text>
    <text x="776" y="113" fill="#94A3B8">school: <tspan fill="#34D399">"HCMUTE (IT)"</tspan>,</text>
    <text x="776" y="136" fill="#94A3B8">domains: <tspan fill="#FBBF24">["Applied AI", "Backend"]</tspan>,</text>
    <text x="776" y="159" fill="#94A3B8">aiStack: <tspan fill="#34D399">["RAG", "FAISS", "MedVQA"]</tspan>,</text>
    <text x="776" y="182" fill="#94A3B8">systems: <tspan fill="#34D399">["FastAPI", "SpringBoot"]</tspan>,</text>
    <text x="776" y="205" fill="#94A3B8">security: <tspan fill="#38BDF8">"Local-First AES-256-GCM"</tspan></text>
    <text x="758" y="228" fill="#94A3B8">};</text>
