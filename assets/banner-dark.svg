  <circle cx="758" cy="48" r="5" fill="#EF4444" fill-opacity="0.85" />
  <circle cx="774" cy="48" r="5" fill="#F59E0B" fill-opacity="0.85" />
  <circle cx="790" cy="48" r="5" fill="#10B981" fill-opacity="0.85" />
  <text x="945" y="52" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="11.5">engineer.profile.ts</text>

