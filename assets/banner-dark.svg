<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="290" role="img" aria-label="Tran Van Tuong — Software &amp; Applied AI Engineering">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1324" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="82%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="14%" cy="88%" r="42%">
